<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title desc">
<title id="title">Temple clothing and etiquette</title><desc id="desc">Cover shoulders and knees. Remove hats and shoes as directed. Usually no photos inside shrines.</desc>
<rect width="760" height="440" fill="#f5f0e7"/>
<g stroke="#153b35" stroke-width="4" fill="none"><circle cx="160" cy="78" r="32"/><path d="M119 128 93 148 61 255 96 268 121 203 121 286 200 286 200 203 225 268 259 255 226 148 201 128Z" fill="#d7e2d8"/><path d="M121 286 119 395 155 395 163 313 171 395 207 395 200 286Z" fill="#c1d1c6"/></g>
<g font-family="Arial, Noto Sans TC, Microsoft JhengHei, Noto Sans JP, Yu Gothic UI, sans-serif" fill="#153b35"><text x="315" y="85" font-size="28" font-weight="bold">SLEEVES + TROUSERS</text><text x="315" y="133" font-size="25">Cover shoulders and knees.</text><text x="315" y="210" font-size="28" font-weight="bold">FOLLOW THE SIGNS</text><text x="315" y="258" font-size="25">Hat off. Shoes off if asked.</text><text x="315" y="334" font-size="28" font-weight="bold">CAMERA AWAY</text><text x="315" y="382" font-size="25">Usually no photos in shrines.</text></g></svg>
